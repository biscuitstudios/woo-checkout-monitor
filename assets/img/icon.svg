<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Woo Checkout Monitor">
	<title>Woo Checkout Monitor</title>
	<!--
		Tabler Icons "list-search", MIT licensed (https://tabler.io/icons).
		Drawn on a 24x24 grid, scaled 7x and centred on a 256 canvas, which
		keeps the original stroke weight ratio (2/24 of the glyph box).

		The source icon uses stroke="currentColor". That is no use here: core
		renders a plugin icon as <img src="...">, so the SVG is its own
		document with nothing to inherit a colour from, and currentColor would
		fall back to black. The stroke is set explicitly instead.

		The tile and the glyph transform are identical across the other Biscuit
		plugins, so the icons read as one set in the plugins list.

		A log being read, not a shield or a cart. This plugin records what
		happened; it does not stop anything, and the icon should not suggest
		otherwise. See README.md.
	-->
	<rect width="256" height="256" rx="56" fill="#ebebeb" />
	<g transform="translate(44 44) scale(7)"
	   fill="none"
	   stroke="#000000"
	   stroke-width="2"
	   stroke-linecap="round"
	   stroke-linejoin="round">
		<path d="M15 15m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
		<path d="M18.5 18.5l2.5 2.5" />
		<path d="M4 6h16" />
		<path d="M4 12h4" />
		<path d="M4 18h4" />
	</g>
</svg>
